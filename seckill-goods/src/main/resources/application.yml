server:
  port: 8082
  tomcat:
    threads:
      max: 100
    accept-count: 200

spring:
  application:
    name: goods-service
  datasource:
    url: jdbc:mysql://localhost:3307/seckill_goods?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: root123
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
  jackson:
    # 与其余服务逐字一致：Feign 跨服务传输时间/Long 字段时两侧格式必须对称
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

seckill:
  bloom:
    # M6 分布式布隆（Redisson bitmap）：预期商品量与误报率。
    # 注意 tryInit 只在 Redis 里 goods:bloom:ids 不存在时才写入这两个参数，
    # 想调整必须先在 redis-cli 里 DEL 掉这个 key 再重启，否则参数不生效
    expected-insertions: 100000
    false-probability: 0.01
  hot-cache:
    # M6 热点隔离：isHot=1 的活动关联商品在 JVM 内多缓存一层（Caffeine），
    # 开抢瞬间不再让所有实例齐打 Redis 的同一个 seckill:goods:{id} 热点 key。
    # TTL 取秒级：本地缓存必然带来各实例短暂不一致，而这里只缓存商品基础信息，
    # 库存永远现查，所以 1s 最终一致完全可接受；调大会同步拉长不一致窗口
    ttl-seconds: 1
    # 热点商品是少数（运营手工标 isHot），1024 条足够且内存占用可忽略
    max-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info
