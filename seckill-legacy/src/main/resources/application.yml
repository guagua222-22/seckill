server:
  port: 8080
  tomcat:
    threads:
      max: 200
    accept-count: 500

spring:
  application:
    name: seckill-monolith
  datasource:
    url: jdbc:mysql://localhost:3307/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: root123
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

seckill:
  seed:
    user-count: ${SEED_USER_COUNT:0}
  mq:
    topic: seckill-order-topic
    consumer-group: seckill-order-consumer

rocketmq:
  name-server: localhost:9876
  producer:
    group: seckill-producer
