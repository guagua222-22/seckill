server:
  port: 8083
  tomcat:
    threads:
      max: 200
    accept-count: 500

spring:
  application:
    name: seckill-service
  datasource:
    url: jdbc:mysql://localhost:3307/seckill_seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: root123
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
  jackson:
    # 与其余服务逐字一致：Feign 跨服务传输时间/Long 字段时两侧格式必须对称
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    openfeign:
      client:
        config:
          default:
            # 内网直连 1s 足够；Feign 默认不重试（Retryer.NEVER），
            # 可靠性靠 requestId 幂等 + MQ 重投 + 对账兜底，绝不靠 Feign 重试
            connect-timeout: 1000
            read-timeout: 2000
    sentinel:
      transport:
        # 控制台只读：实时看 QPS/熔断状态，规则以代码 SentinelRuleConfig 为准
        dashboard: localhost:8858
      # 默认懒加载（第一个请求进来才注册），eager=true 让服务启动即上报控制台
      eager: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

seckill:
  mq:
    topic: seckill-order-topic
    consumer-group: seckill-order-consumer
  hot-cache:
    # M6 热点隔离：活动信息在 JVM 内缓存一层（Caffeine）。
    # seckill:activity:{id} 是全系统最热的 key——开抢时每一单都要读它，
    # 本地缓存把同实例内的并发合并成一次 Redis GET + 一次 Jackson 反序列化。
    # 只缓存活动配置（名字/时间窗/价格），库存永远走 Lua 现扣，超卖防线不依赖它；
    # TTL 越大 Redis 压力越小，但活动配置改动的生效延迟同步变大
    activity-ttl-ms: 1000
    # 同时在售的活动是少数，256 条足够；超出按 Caffeine W-TinyLFU 淘汰
    activity-max-size: 256

rocketmq:
  name-server: localhost:9876
  producer:
    group: seckill-producer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
