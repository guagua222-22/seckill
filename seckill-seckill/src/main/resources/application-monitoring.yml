# M7：启动时添加 --spring.profiles.active=monitoring。
# 管理端口不经 Gateway 转发；本机默认 loopback，Docker 抓取配置见 docs/M7-monitoring.md。
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:19083}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s
      slo:
        http.server.requests: 10ms,50ms,100ms,200ms,500ms,1s,2s,5s

seckill:
  monitoring:
    # 最多 32 个活动，逗号分隔；空值禁用库存采集，不扫描 Redis。
    activity-ids: ${MONITORING_ACTIVITY_IDS:}
    stock-refresh-ms: 15000
