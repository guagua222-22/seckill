# RocketMQ 4.x 本机单点配置（与 docker-compose 配套）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
# 关键：客户端从 namesrv 拿到的必须是宿主机可达地址，否则生产者能发、消费者连不上
brokerIP1 = 127.0.0.1
# 开发期允许自动建 topic（生产环境应改为预创建 + 关闭）
autoCreateTopicEnable = true
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
listenPort = 10911
