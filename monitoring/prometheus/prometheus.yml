global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: seckill-services
    metrics_path: /actuator/prometheus
    # 超出限额使该次抓取失败，优先保护监控系统，不能悄悄丢掉部分指标。
    sample_limit: 20000
    label_limit: 20
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
        refresh_interval: 15s
    # application 标签以目标清单为准，连不上实例时 up 指标仍带服务名称。
    # Actuator/静态页不参与业务 QPS、延迟直方图，避免抓取流量污染低流量服务。
    metric_relabel_configs:
      - source_labels: [__name__, uri]
        regex: 'http_server_requests_seconds.*;(/actuator.*|/|/index.html|/favicon.ico)'
        action: drop
