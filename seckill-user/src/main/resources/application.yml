server:
  port: 8081
  tomcat:
    threads:
      max: 100
    accept-count: 200

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3307/seckill_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: root123
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  jackson:
    # 与其余服务逐字一致：Feign 跨服务传输时间/Long 字段时两侧格式必须对称
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

seckill:
  seed:
    user-count: ${SEED_USER_COUNT:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
